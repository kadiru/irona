[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irona"
version = "0.1.0"
description = "Local conversation, ElevenLabs speech, and explicit Temi or desktop audio."
requires-python = ">=3.10"
dependencies = ["Flask>=3.1,<4", "httpx>=0.28,<0.29", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["irona*"]

[tool.setuptools.package-data]
irona = ["static/*", "static/icons/*", "templates/*", "system_prompt.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
